<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<link rel="stylesheet" href="../../medias/Categorised/Dist/css/app.css">
		<meta name="description" content="Find an undergraduate or postgraduate taught course at the University of Stirling" />
		<!-- for optimal display on high DPI devices -->
			<meta name="viewport" content="width=device-width" />
			
		
		<style>
		</style>
		<style>
			main {
				margin: 2rem;
			}
			h1 {
				margin: 0;
			}
		</style>
	</head>

	<body>
		<main>

			<div data-inject=tour style="width:90%;max-width:32rem;margin: 0 auto;"></div>


			<script>
				async function getData(url) {
					try {
						const response = await fetch(url);
						if (!response.ok) {
						throw new Error(`Response status: ${response.status}`);
						}
					
						const result = await response.json();
						return result;
					} catch (error) {
						console.error(error.message);
					}
				}
			</script>
			
			<script type="module">
				
				(()=>{
					
					const el = document.querySelector('[data-inject=tour]');
				
					getData("./locations.json")
						.then(locations => {
							console.info(locations);
							
							locations.forEach(location => {
								const p  = document.createElement('h2');
								const i  = document.createElement('img');
								const ul = document.createElement('div');
								p.textContent = location.options.caption;
								i.src = `./img/${location.panorama}`;
								i.setAttribute("loading","lazy");
								location.markers.forEach(marker => {
									//const li = document.createElement('li');
									//li.textContent = "";
									ul.innerHTML += (marker.html||"");
								});
								el.append(p);
								el.append(i);
								el.append(ul);
							});
						});
				
				})();
			
			</script>
<!-- -->


		</main>
		
		<script src="../../medias/Categorised/Dist/js/app.js"></script>
		
	</body>

</html>
